name: Flutter Build & Release(Prod) APK

# Prod = Play Integrity App Check (no debug token in the binary). Cloud tiers
# only verify when installed through Google Play (including internal testing
# tracks); use the internal APK for sideloading.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # The runner ships with ~14 GB free; Gradle + three split-ABI release builds
      # can run out of space. Drop preinstalled toolchains this build never uses
      # (keeps the Android SDK in /usr/local/lib/android).
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/local/share/powershell /usr/local/share/chromium \
            /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby /opt/microsoft /opt/google/chrome
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Firebase and signing config
        uses: ./.github/actions/create-firebase-config
        with:
          google_services_json_b64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          upload_keystore_b64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          key_properties_b64: ${{ secrets.KEY_PROPERTIES_B64 }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Clean Flutter build artifacts
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Run Flutter Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Adjust Gradle Memory for CI Runner
        run: |
          sed -i 's/-Xmx8G/-Xmx3G/g' android/gradle.properties
          sed -i 's/-XX:MaxMetaspaceSize=4G/-XX:MaxMetaspaceSize=1G/g' android/gradle.properties

      - name: Build APK (Split per ABI)
        run: flutter build apk --release --split-per-abi

      # Each ABI split zipped on its own (not bundled together). Include the
      # build channel in both the APK and archive names so production builds
      # cannot overwrite internal assets on the rolling release.
      - name: Label and zip production APKs
        run: |
          cd build/app/outputs/flutter-apk
          for apk in app-*-release.apk; do
            abi="${apk#app-}"
            abi="${abi%-release.apk}"
            labeled_apk="navisense-prod-${abi}.apk"
            mv "$apk" "$labeled_apk"
            zip "${labeled_apk%.apk}.zip" "$labeled_apk"
            mv "${labeled_apk%.apk}.zip" "$GITHUB_WORKSPACE/"
          done

      # Replaces this build's files on the single rolling `latest` release.
      - name: Publish to latest release
        uses: ./.github/actions/publish-latest
        with:
          files: navisense-prod-*.zip
