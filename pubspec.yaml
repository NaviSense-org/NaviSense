name: navisense
description: Hybrid AI spatial guide for blind and low-vision users (Android).
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.2.0
  firebase_ai: ^5.2.0
  firebase_app_check: ^0.5.2
  firebase_remote_config: ^7.1.0
  google_mlkit_object_detection: ^1.0.3
  google_mlkit_image_labeling: ^1.0.3
  google_mlkit_text_recognition: ^1.0.3
  camera: ^0.12.2
  flutter_riverpod: ^3.5.0
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
